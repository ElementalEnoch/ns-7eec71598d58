<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Nine Scrolls sound test</title><style>
:root{--bg:#111014;--card:#1d1b22;--ink:#f2eee8;--dim:#9a94a3;--hot:#e0473a}*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,system-ui,sans-serif}
h1{font-size:22px;margin:4px 0}p{color:var(--dim);margin:0 0 12px}h2{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--hot);margin:22px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
button{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px;border:1px solid #2c2933;border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
button b{min-width:34px;height:34px;border-radius:50%;background:#2c2933;display:grid;place-items:center;font-size:15px}
button.on{border-color:var(--hot)}button.on b{background:var(--hot)}.v{color:var(--dim);font-size:13px;display:block}
#stop{position:sticky;top:8px;z-index:2;width:auto;margin:6px 0 4px;padding:10px 16px;background:#2c2933;justify-content:center}
</style></head><body><h1>Nine Scrolls sound test</h1><p>Build 13 - tap a sound to hear it. Note the numbers you don't like.</p>
<button id="stop">Stop all</button><h2>Your attacks</h2><div class="grid"><button data-src="punch_light_0.m4a"><b>1</b><span>Light hit (jab, cross, kicks)<span class="v">version 1</span></span></button><button data-src="punch_light_1.m4a"><b>2</b><span>Light hit (jab, cross, kicks)<span class="v">version 2</span></span></button><button data-src="punch_light_2.m4a"><b>3</b><span>Light hit (jab, cross, kicks)<span class="v">version 3</span></span></button><button data-src="punch_light_3.m4a"><b>4</b><span>Light hit (jab, cross, kicks)<span class="v">version 4</span></span></button><button data-src="punch_light_4.m4a"><b>5</b><span>Light hit (jab, cross, kicks)<span class="v">version 5</span></span></button><button data-src="punch_light_5.m4a"><b>6</b><span>Light hit (jab, cross, kicks)<span class="v">version 6</span></span></button><button data-src="punch_light_6.m4a"><b>7</b><span>Light hit (jab, cross, kicks)<span class="v">version 7</span></span></button><button data-src="punch_heavy_0.m4a"><b>8</b><span>Heavy hit<span class="v">version 1</span></span></button><button data-src="punch_heavy_1.m4a"><b>9</b><span>Heavy hit<span class="v">version 2</span></span></button><button data-src="punch_heavy_2.m4a"><b>10</b><span>Heavy hit<span class="v">version 3</span></span></button><button data-src="punch_heavy_3.m4a"><b>11</b><span>Heavy hit<span class="v">version 4</span></span></button><button data-src="punch_heavy_4.m4a"><b>12</b><span>Heavy hit<span class="v">version 5</span></span></button><button data-src="punch_heavy_5.m4a"><b>13</b><span>Heavy hit<span class="v">version 6</span></span></button><button data-src="thump_0.m4a"><b>14</b><span>Finisher / launcher / flying kick boom<span class="v">version 1</span></span></button><button data-src="thump_1.m4a"><b>15</b><span>Finisher / launcher / flying kick boom<span class="v">version 2</span></span></button><button data-src="thump_2.m4a"><b>16</b><span>Finisher / launcher / flying kick boom<span class="v">version 3</span></span></button><button data-src="thump_3.m4a"><b>17</b><span>Finisher / launcher / flying kick boom<span class="v">version 4</span></span></button><button data-src="whoosh_0.m4a"><b>18</b><span>Attack swing<span class="v">version 1</span></span></button><button data-src="whoosh_1.m4a"><b>19</b><span>Attack swing<span class="v">version 2</span></span></button><button data-src="whoosh_2.m4a"><b>20</b><span>Attack swing<span class="v">version 3</span></span></button><button data-src="whoosh_3.m4a"><b>21</b><span>Attack swing<span class="v">version 4</span></span></button></div><h2>Your moves</h2><div class="grid"><button data-src="dash.m4a"><b>22</b><span>Dash</span></button><button data-src="jump.m4a"><b>23</b><span>Jump</span></button><button data-src="land.m4a"><b>24</b><span>Landing</span></button><button data-src="dodge_sting.m4a"><b>25</b><span>Perfect dodge</span></button><button data-src="hurt_0.m4a"><b>26</b><span>You get hit<span class="v">version 1</span></span></button><button data-src="hurt_1.m4a"><b>27</b><span>You get hit<span class="v">version 2</span></span></button><button data-src="hurt_2.m4a"><b>28</b><span>You get hit<span class="v">version 3</span></span></button><button data-src="hurt_3.m4a"><b>29</b><span>You get hit<span class="v">version 4</span></span></button><button data-src="hurt_4.m4a"><b>30</b><span>You get hit<span class="v">version 5</span></span></button><button data-src="player_die.m4a"><b>31</b><span>You die</span></button></div><h2>Flame Beam</h2><div class="grid"><button data-src="meter_full.m4a"><b>32</b><span>Meter full</span></button><button data-src="flame_windup.m4a"><b>33</b><span>Beam cast</span></button><button data-src="flame_loop.m4a"><b>34</b><span>Beam roar (loops)</span></button><button data-src="flame_tail.m4a"><b>35</b><span>Beam ends</span></button></div><h2>Enemies</h2><div class="grid"><button data-src="club_swing.m4a"><b>36</b><span>Cultist club swing</span></button><button data-src="club_hit_0.m4a"><b>37</b><span>Club hits you<span class="v">version 1</span></span></button><button data-src="club_hit_1.m4a"><b>38</b><span>Club hits you<span class="v">version 2</span></span></button><button data-src="club_hit_2.m4a"><b>39</b><span>Club hits you<span class="v">version 3</span></span></button><button data-src="bolt_fire.m4a"><b>40</b><span>Mage fires bolt</span></button><button data-src="bolt_hit.m4a"><b>41</b><span>Bolt hits</span></button><button data-src="grunt_0.m4a"><b>42</b><span>Enemy hurt grunt<span class="v">version 1</span></span></button><button data-src="grunt_1.m4a"><b>43</b><span>Enemy hurt grunt<span class="v">version 2</span></span></button><button data-src="grunt_2.m4a"><b>44</b><span>Enemy hurt grunt<span class="v">version 3</span></span></button><button data-src="grunt_3.m4a"><b>45</b><span>Enemy hurt grunt<span class="v">version 4</span></span></button><button data-src="grunt_4.m4a"><b>46</b><span>Enemy hurt grunt<span class="v">version 5</span></span></button><button data-src="enemy_die.m4a"><b>47</b><span>Enemy dies</span></button><button data-src="death_poof.m4a"><b>48</b><span>Enemy vanishes</span></button></div><h2>World</h2><div class="grid"><button data-src="amb_valley.m4a"><b>49</b><span>Valley ambience (loops)</span></button></div><script>
let cur=null,curBtn=null;function stop(){if(cur){cur.pause();cur.currentTime=0;}if(curBtn)curBtn.classList.remove('on');cur=null;curBtn=null;}
document.getElementById('stop').onclick=stop;document.querySelectorAll('button[data-src]').forEach(function(b){b.onclick=function(){stop();
const a=new Audio(b.dataset.src);a.loop=b.textContent.indexOf('loops')>=0;a.play();cur=a;curBtn=b;b.classList.add('on');a.onended=function(){if(curBtn===b)b.classList.remove('on');};};});
</script></body></html>
